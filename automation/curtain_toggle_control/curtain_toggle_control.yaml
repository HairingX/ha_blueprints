blueprint:
  name: Curtain Toggle Control
  description: >
    Toggles one or more curtains from any trigger(s):
    stops if moving, opens if all closed, otherwise closes.
  domain: automation
  author: HairingX
  homeassistant:
    min_version: 2026.10.0
  source_url: https://github.com/HairingX/ha_blueprints/blob/main/automation/curtain_toggle_control/curtain_toggle_control.yaml
  input:
    control_triggers:
      name: Control triggers
      description: One or more triggers that toggle the curtain(s), e.g. button long press, switch, etc.
      selector:
        trigger: {}
    curtains:
      name: Curtain(s)
      selector:
        entity:
          domain: cover
          multiple: true

triggers: !input control_triggers

conditions: []

actions:
  - variables:
      curtain_entities: !input curtains
  - action: homeassistant.update_entity
    target:
      entity_id: "{{ curtain_entities }}"
  - variables:
      curtain_states: "{{ expand(curtain_entities) | map(attribute='state') | list }}"
  - choose:
      - alias: Curtain is moving
        conditions:
          - condition: template
            value_template: "{{ 'opening' in curtain_states or 'closing' in curtain_states }}"
        sequence:
          - action: cover.stop_cover
            target:
              entity_id: "{{ curtain_entities }}"
      - alias: All closed
        conditions:
          - condition: template
            value_template: >
              {{ curtain_states | length > 0 and
                 curtain_states | reject('eq', 'closed') | list | length == 0 }}
        sequence:
          - action: cover.open_cover
            target:
              entity_id: "{{ curtain_entities }}"
      - alias: Any open
        conditions:
          - condition: template
            value_template: "{{ 'open' in curtain_states }}"
        sequence:
          - action: cover.close_cover
            target:
              entity_id: "{{ curtain_entities }}"

mode: single
max_exceeded: silent

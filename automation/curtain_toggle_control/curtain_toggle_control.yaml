blueprint:
  name: Curtain Toggle Control
  description: >
    Toggles one or more curtains from any trigger(s), like a dimmer button:
    stops if moving, opens if closed, closes if fully open.
    With the optional direction memory helper, a curtain that was stopped
    mid-way reverses its last direction on the next press.
    State is used to detect movement; position (with a margin) decides
    whether an open/closed curtain is at an end position.
  domain: automation
  author: HairingX
  homeassistant:
    min_version: 2026.10.0
  source_url: https://github.com/HairingX/ha_blueprints/blob/main/automation/curtain_toggle_control/curtain_toggle_control.yaml
  input:
    control_triggers:
      name: Control triggers
      description: One or more triggers that toggle the curtain(s), e.g. button long press, switch, etc.
      selector:
        trigger: {}
    curtains:
      name: Curtain(s)
      selector:
        entity:
          domain: cover
          multiple: true
    direction_memory:
      name: Direction memory (optional)
      description: >
        input_boolean that remembers the last movement direction
        (on = opening, off = closing). When set, a curtain stopped mid-way
        moves the opposite way on the next press. Leave empty to always
        close a partially open curtain.
      default: ""
      selector:
        entity:
          domain: input_boolean
    end_margin:
      name: End position margin
      description: >
        A position within this many percent of 0 counts as closed, and within
        this many percent of 100 counts as fully open. Only used for covers
        that report a position.
      default: 2
      selector:
        number:
          min: 0
          max: 10
          step: 1
          unit_of_measurement: "%"
          mode: slider

triggers:
  - triggers: !input control_triggers
  - trigger: state
    entity_id: !input curtains
    to: opening
    id: curtain_opening
  - trigger: state
    entity_id: !input curtains
    to: closing
    id: curtain_closing
  - trigger: state
    entity_id: !input curtains
    to: closed
    id: curtain_closed
  - trigger: state
    entity_id: !input curtains
    to: open
    id: curtain_opened

conditions: []

actions:
  - variables:
      curtain_entities: !input curtains
      helper: !input direction_memory
      margin: !input end_margin
      has_helper: "{{ helper | length > 0 }}"
  - choose:
      # Movement reported (also covers app, remote, schedules)
      - conditions:
          - condition: trigger
            id: curtain_opening
        sequence:
          - if:
              - condition: template
                value_template: "{{ has_helper }}"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: "{{ helper }}"
      - conditions:
          - condition: trigger
            id:
              - curtain_closing
              - curtain_closed
        sequence:
          - if:
              - condition: template
                value_template: "{{ has_helper }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ helper }}"
      # Reported "open": classify by position, since "open" is also reported
      # when stopped mid-way. Without position: fully open unless it came
      # from "closing" (= stopped while closing).
      - conditions:
          - condition: trigger
            id: curtain_opened
        sequence:
          - variables:
              pos: "{{ trigger.to_state.attributes.current_position | default(none) }}"
              end_reached: >
                {% if pos is number and pos <= margin %}closed
                {%- elif pos is number and pos >= 100 - margin %}open
                {%- elif pos is not number and trigger.from_state is not none
                         and trigger.from_state.state != 'closing' %}open
                {%- else %}none{% endif %}
          - if:
              - condition: template
                value_template: "{{ has_helper and end_reached == 'open' }}"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: "{{ helper }}"
          - if:
              - condition: template
                value_template: "{{ has_helper and end_reached == 'closed' }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ helper }}"
    # Control trigger
    default:
      - action: homeassistant.update_entity
        target:
          entity_id: "{{ curtain_entities }}"
      - variables:
          # Effective state per curtain: moving / closed / full / partial
          effective: >
            {% set ns = namespace(out=[]) %}
            {% for c in expand(curtain_entities) %}
              {% set pos = c.attributes.current_position | default(none) %}
              {% if c.state in ['opening', 'closing'] %}
                {% set ns.out = ns.out + ['moving'] %}
              {% elif c.state == 'closed' or (c.state == 'open' and pos is number and pos <= margin) %}
                {% set ns.out = ns.out + ['closed'] %}
              {% elif c.state == 'open' and pos is number and pos >= 100 - margin %}
                {% set ns.out = ns.out + ['full'] %}
              {% elif c.state == 'open' %}
                {% set ns.out = ns.out + ['partial'] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
          last_was_closing: "{{ has_helper and is_state(helper, 'off') }}"
      - choose:
          - alias: Curtain is moving
            conditions:
              - condition: template
                value_template: "{{ 'moving' in effective }}"
            sequence:
              - action: cover.stop_cover
                target:
                  entity_id: "{{ curtain_entities }}"
          - alias: All closed, or stopped while closing
            conditions:
              - condition: template
                value_template: >
                  {{ effective | length > 0 and
                     (effective | reject('eq', 'closed') | list | length == 0
                      or (last_was_closing and 'full' not in effective)) }}
            sequence:
              - action: cover.open_cover
                target:
                  entity_id: "{{ curtain_entities }}"
              - if:
                  - condition: template
                    value_template: "{{ has_helper }}"
                then:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: "{{ helper }}"
          - alias: Fully open, or stopped while opening
            conditions:
              - condition: template
                value_template: "{{ 'full' in effective or 'partial' in effective }}"
            sequence:
              - action: cover.close_cover
                target:
                  entity_id: "{{ curtain_entities }}"
              - if:
                  - condition: template
                    value_template: "{{ has_helper }}"
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: "{{ helper }}"

mode: queued
max: 10
max_exceeded: silent

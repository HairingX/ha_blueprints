blueprint:
  name: Alarm Light
  description: >
    While the alarm trigger is on, keeps one light at full brightness and
    flashes another. When the trigger turns off, both lights are switched off.
  domain: automation
  author: HairingX
  homeassistant:
    min_version: 2024.10.0
  source_url: https://github.com/HairingX/ha_blueprints/blob/main/automation/alarm_light/alarm_light.yaml
  input:
    alarm_trigger:
      name: Trigger
      description: The input_boolean that turns the alarm light on and off.
      selector:
        entity:
          domain: input_boolean
    always_on_light:
      name: Always on light (optional)
      description: The light kept at full brightness while the alarm is on.
      default: ""
      selector:
        entity:
          domain: light
    flashing_light:
      name: Flashing light (optional)
      description: The light that flashes while the alarm is on.
      default: ""
      selector:
        entity:
          domain: light

mode: restart

triggers:
  - trigger: state
    entity_id: !input alarm_trigger
    to: "on"
    id: alarm_on
  - trigger: state
    entity_id: !input alarm_trigger
    to: "off"
    id: alarm_off

actions:
  - variables:
      alarm_trigger: !input alarm_trigger
      always_on_light: !input always_on_light
      flashing_light: !input flashing_light
      # The lights that are selected; an empty input is left out.
      lights: "{{ [always_on_light, flashing_light] | select | list }}"
  - choose:
      - alias: Alarm on
        conditions:
          - condition: trigger
            id: alarm_on
        sequence:
          - if:
              - condition: template
                value_template: "{{ always_on_light not in [none, ''] }}"
            then:
              - action: light.turn_on
                target:
                  entity_id: "{{ always_on_light }}"
                data:
                  transition: 1
                  brightness_pct: 100
          - if:
              - condition: template
                value_template: "{{ flashing_light not in [none, ''] }}"
            then:
              - repeat:
                  sequence:
                    - action: light.turn_on
                      target:
                        entity_id: "{{ flashing_light }}"
                      data:
                        transition: 1
                        brightness_pct: 100
                    - delay:
                        seconds: 1
                    - action: light.turn_off
                      target:
                        entity_id: "{{ flashing_light }}"
                      data:
                        transition: 2
                  until:
                    - condition: template
                      value_template: "{{ not is_state(alarm_trigger, 'on') }}"
      # In restart mode the run that flashes is stopped when the trigger turns
      # off, so switching the lights off has to be a run of its own.
      - alias: Alarm off
        conditions:
          - condition: trigger
            id: alarm_off
          - condition: template
            value_template: "{{ lights | length > 0 }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: "{{ lights }}"
            data:
              transition: 1

blueprint:
  name: Single button advanced light switch
  description: >
    Switch a light on or off by pressing a button. Hold the same button to dim
    the light up or down, the opposite way of the last dim.
  domain: automation
  author: HairingX
  homeassistant:
    min_version: 2024.10.0
  source_url: https://github.com/HairingX/ha_blueprints/blob/main/automation/single_button_advanced_light_switch/single_button_advanced_light_switch.yaml
  input:
    button:
      name: Push button
      description: >
        Entity for a physical push button that springs back when released.
        It must be on while the button is pressed and off when it is released.
      selector:
        entity:
          domain:
            - binary_sensor
            - input_boolean
    light:
      name: Light
      selector:
        entity:
          domain: light
    last_transition_state:
      name: Last transition state (optional)
      description: >
        input_number that keeps the last dim direction (-1 or 1), so the next
        hold dims the opposite way. Without it, the light dims down above half
        brightness and up below it.
      default: ""
      selector:
        entity:
          domain: input_number
    hold_threshold:
      name: Hold threshold
      description: How long a press must last to count as a hold.
      default: 0.8
      selector:
        number:
          min: 0.05
          max: 10.0
          step: 0.05
          unit_of_measurement: s
          mode: slider
    brightness_transition_length:
      name: Brightness transition
      description: Time for a full dim from one bound to the other.
      default: 4.0
      selector:
        number:
          min: 1.0
          max: 10.0
          step: 0.1
          unit_of_measurement: s
          mode: slider
    brightness_transition_overshoot_value:
      name: Overshoot amount
      description: Brightness added past the point where the button was released.
      default: 0
      selector:
        number:
          min: -15
          max: 15
          step: 1
          unit_of_measurement: brightness
          mode: slider
    brightness_transition_overshoot_transition_length:
      name: Overshoot correction transition
      description: Transition time for the overshoot correction.
      default: 0.3
      selector:
        number:
          min: 0.0
          max: 5.0
          step: 0.1
          unit_of_measurement: s
          mode: slider
    brightness_transition_minimum:
      name: Lower brightness bound
      description: Lowest brightness when dimming.
      default: 0.1
      selector:
        number:
          min: 0.1
          max: 100.0
          step: 0.1
          unit_of_measurement: "%"
          mode: slider
    brightness_transition_maximum:
      name: Upper brightness bound
      description: Highest brightness when dimming.
      default: 100.0
      selector:
        number:
          min: 0.1
          max: 100.0
          step: 0.1
          unit_of_measurement: "%"
          mode: slider

mode: queued
max: 2

triggers:
  - trigger: state
    entity_id: !input button
    to: "on"

variables:
  entity_id_light: !input light
  entity_id_button: !input button
  helper: !input last_transition_state
  has_helper: "{{ helper not in [none, ''] }}"

actions:
  - wait_for_trigger:
      - trigger: state
        entity_id: !input button
        from: "on"
        to: "off"
    timeout: !input hold_threshold
    continue_on_timeout: true
  - choose:
      - alias: Held, dim up or down
        conditions:
          - condition: template
            value_template: "{{ wait.trigger is none }}"
        sequence:
          - variables:
              # Read after the hold threshold, so Hue lights (one change a second
              # through the bridge) report the brightness of before the press.
              initial_brightness: "{{ state_attr(entity_id_light, 'brightness') | float(0) }}"
              brightness_transition_length: !input brightness_transition_length
              brightness_transition_minimum: !input brightness_transition_minimum
              brightness_transition_maximum: !input brightness_transition_maximum
              brightness_transition_overshoot_value: !input brightness_transition_overshoot_value
              brightness_transition_overshoot_transition_length: !input brightness_transition_overshoot_transition_length
              minimum_brightness: "{{ (1, brightness_transition_minimum * 2.55) | max | round }}"
              maximum_brightness: "{{ (255, (brightness_transition_minimum, brightness_transition_maximum) | max * 2.55) | min | round }}"
              brightness_range: "{{ maximum_brightness - minimum_brightness }}"
              brightness_direction: >
                {% if has_helper and states(helper) | int(0) != 0 %}
                  {{ states(helper) | int * -1 }}
                {% elif initial_brightness > brightness_range / 2 %}
                  -1
                {% else %}
                  1
                {% endif %}
              brightness_target_value: "{{ minimum_brightness if brightness_direction < 0 else maximum_brightness }}"
              brightness_change_diff: "{{ (brightness_target_value - initial_brightness) | abs }}"
              brightness_change_time: "{{ brightness_transition_length / brightness_range * brightness_change_diff }}"
          - action: light.turn_on
            target:
              entity_id: "{{ entity_id_light }}"
            data:
              transition: "{{ brightness_change_time }}"
              brightness: "{{ brightness_target_value }}"
          - if:
              - condition: template
                value_template: "{{ has_helper }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: "{{ helper }}"
                data:
                  value: "{{ brightness_direction }}"
          - wait_for_trigger:
              - trigger: state
                entity_id: !input button
                to: "off"
            timeout: "{{ brightness_change_time if is_state(entity_id_button, 'on') else 0 }}"
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ wait.remaining > 0 or is_state(entity_id_button, 'off') }}"
            then:
              # Released before the bound: stop the light where it is now.
              - action: light.turn_on
                target:
                  entity_id: "{{ entity_id_light }}"
                data:
                  transition: "{{ brightness_transition_overshoot_transition_length }}"
                  brightness: >
                    {% if wait.remaining > 0 %}
                      {{ initial_brightness + ((brightness_change_diff / brightness_change_time) * (brightness_change_time - wait.remaining) + brightness_transition_overshoot_value) * brightness_direction }}
                    {% else %}
                      {{ (minimum_brightness, (maximum_brightness, initial_brightness + 2 * brightness_direction) | min) | max }}
                    {% endif %}
    default:
      # Pressed shorter than the hold threshold: switch the light on or off.
      - if:
          - condition: template
            value_template: "{{ state_attr(entity_id_light, 'brightness') | float(0) > 0 }}"
        then:
          - action: light.turn_off
            target:
              entity_id: "{{ entity_id_light }}"
          - if:
              - condition: template
                value_template: "{{ has_helper }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: "{{ helper }}"
                data:
                  value: -1
        else:
          - action: light.turn_on
            target:
              entity_id: "{{ entity_id_light }}"
          - if:
              - condition: template
                value_template: "{{ has_helper }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: "{{ helper }}"
                data:
                  value: 1
